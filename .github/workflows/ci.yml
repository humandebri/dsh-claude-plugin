name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x]
    steps:
      - name: Check out exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  profile-e2e:
    name: DSH 0.1.1-rc.2 profile install/remove
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run test:profile

  web-e2e:
    name: DSH 0.1.1-rc.2 WebUI keyless E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Install the DSH-pinned Chromium runtime
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:web
      - name: Upload sanitized WebUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-claude-web-e2e
          path: .artifacts/
          if-no-files-found: error
